[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellhound"
version = "0.1.1"
description = "Web-native DFIR workbench for webserver compromises (WordPress/Joomla)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# 3.10 ist die Untergrenze, nicht Geschmackssache: der Code benutzt
# durchgehend `X | None` als Typangabe (PEP 604), und das ist ab 3.10 zur
# Laufzeit gültig.
requires-python = ">=3.10"
authors = [{ name = "SHELLHOUND contributors" }]
keywords = ["dfir", "forensics", "incident-response", "webshell", "wordpress", "joomla"]
# Kein License-Classifier: seit PEP 639 zählt der `license`-Ausdruck oben,
# und setuptools weist die alte Doppelung inzwischen zurück.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Länderzuordnung aus einer LOKALEN Datenbank. Ohne das Paket läuft
  # alles, nur ohne Flaggen — deshalb steht es hier und nicht in [optional].
  "maxminddb>=2.5",
]

[project.urls]
Homepage = "https://github.com/Mateodevv/shellhound"
Changelog = "https://github.com/Mateodevv/shellhound/blob/main/CHANGELOG.md"
Security = "https://github.com/Mateodevv/shellhound/blob/main/SECURITY.md"

[project.scripts]
shellhound = "server.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["server*"]

# Die gebaute Oberfläche gehört ins Paket, damit eine Installation ohne
# Node-Toolchain auskommt. Sie muss dafür VOR dem Bauen nach server/static
# kopiert werden:
#     cd web && npm ci && npm run build && cd ..
#     cp -r web/dist server/static      # PowerShell: Copy-Item -Recurse
#     pip install .
# Im Repo selbst ist das nicht nötig — dort findet der Server web/dist.
[tool.setuptools.package-data]
"server" = ["static/**/*"]
