[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellhound"
version = "0.1.1"
description = "Web-native DFIR workbench for webserver compromises (WordPress/Joomla)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# 3.10 is the floor, not a matter of taste: the code uses `X | None` as a
# type annotation throughout (PEP 604), and that is valid at runtime from
# 3.10 on.
requires-python = ">=3.10"
authors = [{ name = "SHELLHOUND contributors" }]
keywords = ["dfir", "forensics", "incident-response", "webshell", "wordpress", "joomla"]
# No license classifier: since PEP 639 the `license` expression above is
# what counts, and setuptools now rejects the old duplication.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Country attribution from a LOCAL database. Without the package
  # everything still works, only without flags -- hence here and not in
  # [optional].
  "maxminddb>=2.5",
]

[project.optional-dependencies]
# YARA is the analyst's OWN rules, and not everyone brings some. Without the
# package everything else works unchanged and the interface says which of the
# two silences it is -- no rules, or no YARA.
yara = ["yara-python>=4.3"]

[project.urls]
Homepage = "https://github.com/Mateodevv/shellhound"
Changelog = "https://github.com/Mateodevv/shellhound/blob/main/CHANGELOG.md"
Security = "https://github.com/Mateodevv/shellhound/blob/main/SECURITY.md"

[project.scripts]
shellhound = "server.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["server*"]

# The built interface belongs in the package so that an installation gets by
# without a Node toolchain. For that it has to be copied to server/static
# BEFORE building:
#     cd web && npm ci && npm run build && cd ..
#     cp -r web/dist server/static      # PowerShell: Copy-Item -Recurse
#     pip install .
# Inside the repository this is unnecessary -- there the server finds
# web/dist.
[tool.setuptools.package-data]
"server" = ["static/**/*"]
