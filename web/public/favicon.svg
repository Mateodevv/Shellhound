<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SHELLHOUND">
  <!-- A trace that runs flat, steps up once, and stays up, with the knee of
       the step marked by a single red node.

       The finding this tool exists to produce is almost never a spike – it
       is a level change that does not come back down: a shell dropped, an
       admin row planted, a backdoor that keeps answering. A step is the shape
       of persistence where a spike is the shape of a transient.

       The two colours carry the separation the product is built on.
       Everything measured is accent blue; exactly one point is severity red,
       and it is a node rather than a wash – the tool never claims more than
       one marked point's worth.

       The geometry is chosen for 16x16, which is where a favicon actually
       lives: stroke 4 on a 32 grid survives as 2 device pixels, the rise
       spans 14 of 32 units so the step stays unmistakable at six pixels tall,
       and the vertical sits at x=16 so the mark is optically centred.
       Verified by rasterising at 16px, not by looking at it large. -->
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <path d="M5 24H16V10h11" fill="none" stroke="#3987e5" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="10" r="3.6" fill="#d03b3b"/>
</svg>
