<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SHELLHOUND">
<title>SHELLHOUND</title>
<!-- SHELLHOUND README banner. 1200x300, self-contained, no external
     references and no <text> element anywhere: GitHub renders this as an
     image without the author's fonts, so the wordmark is drawn as paths.

     THE LOCKUP. The mark is the same object as web/public/favicon.svg – a
     trace that runs flat, steps up once and stays up, with the knee marked
     in severity red. It is placed here at 2.2x off its own 32-unit grid,
     which puts its ink height at 43 against a cap height of 56: it leads the
     wordmark without out-shouting it.

     THE WORDMARK. Ten letters from one geometric alphabet – monolinear,
     stem width 10, cap height 56, butt terminals. Straight members are
     stroked centrelines so the stem stays exactly 10 units on curves; the N
     diagonal is a filled parallelogram, because a stroked polyline would
     grow a miter spike above the cap line.

     THE FIELD. Behind and around it, the tool's own output as quiet texture:
     a request-rate timeline along the bottom (ambient traffic muted, the
     interesting window in accent blue, its peak in severity red) and a
     ghosted findings list at the right. The dotted red line ties the one
     flagged finding to the moment in the traffic it belongs to – which is
     the entire job this tool does, drawn once.

     The panel carries its own near-black background so the banner is
     self-sufficient on GitHub's light and dark themes alike. -->
<rect width="1200" height="300" rx="12" fill="#0b0e14"/>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="11.25" fill="none" stroke="#1c2432" stroke-width="1.5"/>
