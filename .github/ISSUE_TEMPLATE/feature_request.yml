name: Feature request
description: Something the tool should be able to establish about an incident and cannot.
title: "[Feature] "
labels: ["enhancement"]
assignees: ["Mateodevv"]
body:
  - type: markdown
    attributes:
      value: |
        Framed as a workflow problem it is actionable; framed as a solution it
        usually is not. What are you trying to find out, and what do you do
        instead today?

        Two positions that shape what fits: the tool separates observation
        from verdict and never claims more than the evidence shows, and it
        sends nothing outward except three opt-in lookups.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to establish
      placeholder: Whether the same client that hit the exploit path later came back through a different one.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do instead today
      placeholder: Export two traces and diff the address lists by hand.
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: Before you submit
      options:
        - label: No data from a real case in this issue.
          required: true
