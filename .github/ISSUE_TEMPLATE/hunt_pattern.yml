name: Propose a hunt pattern
description: A URL path that identifies a known exploit, for the shipped pattern library.
title: "[Pattern] "
labels: ["pattern"]
assignees: ["Mateodevv"]
body:
  - type: markdown
    attributes:
      value: |
        Accepted patterns are merged into
        [`server/patterns_bundled.json`](https://github.com/Mateodevv/shellhound/blob/main/server/patterns_bundled.json)
        and ship switched on in every workspace. That is why the last field
        matters most: a pattern that also matches ordinary traffic does not
        cost one analyst a look, it costs all of them a filled work list.

        Paths, not regular expressions — `*` is the wildcard.

  - type: textarea
    id: patterns
    attributes:
      label: Path(s)
      description: One per line. Several are combined over CLIENTS — say below whether a hit needs one of them or all of them.
      render: text
      placeholder: /index.php?option=com_jce&task=profiles.import
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: What it is called in the library. Short enough to read in a list.
      placeholder: Joomla JCE editor RCE
    validations:
      required: true

  - type: input
    id: cve
    attributes:
      label: CVE or advisory
      placeholder: CVE-2026-48907

  - type: textarea
    id: description
    attributes:
      label: What a hit proves
      description: And what it does not. This is the sentence an analyst reads six months later, when the CVE number alone no longer says why the path was on the list.
      placeholder: An unauthenticated upload endpoint. A 2xx means the handler answered — not that a file landed; look for a new file in the webroot around the same time.
    validations:
      required: true

  - type: textarea
    id: also_matches
    attributes:
      label: What else would match this
      description: Ordinary traffic, other software, scanner noise. "Nothing" is an answer, if you have checked.
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: Before you submit
      options:
        - label: No host names, addresses or log lines from a real case.
          required: true
