name: Bug report
description: A crash, a hang, or an interface that showed something other than what happened.
title: "[Bug] "
labels: ["bug"]
assignees: ["Mateodevv"]
body:
  - type: markdown
    attributes:
      value: |
        **Nothing from a real case.** Paths, log lines, hashes, addresses and
        account names are somebody's incident. Write the *shape* instead:
        `<evidence>/wp-content/uploads/x.php`, `203.0.113.7`, `<sha256>`.
        Keep what might be the bug — depth, extension, spaces, non-ASCII,
        drive letter, length.

        A rule that judged wrongly belongs in the **detection rule** form.
        A vulnerability in SHELLHOUND itself goes to
        [SECURITY.md](https://github.com/Mateodevv/shellhound/blob/main/SECURITY.md),
        never here.

  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit if you run from a checkout.
      placeholder: 0.1.1 — or main @ 1a2b3c4
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Path handling breaks on one and not the other, which is why CI runs both.
      options: [Windows, Linux, macOS, WSL, Other]
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. Add the shape of the evidence if it could matter — sizes, counts, formats, where it sits.
      placeholder: |
        1. Registered a webroot copy and one 2 GB access log, on an external drive.
        2. Analyse — all jobs green.
        3. Findings, severity filter to HIGH.

        Expected the 12 HIGH findings. List stayed empty; the counter still said 12.
        After a reload they were there.
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or console output
      description: From the server terminal, or the browser console for an interface bug. Redact paths, keep their structure.
      render: text

  - type: checkboxes
    id: ack
    attributes:
      label: Before you submit
      options:
        - label: This contains no data from a real case — no evidence paths, log lines, hashes, addresses, account names or unredacted screenshots.
          required: true
