name: Detection rule got it wrong
description: A rule fired on something clean, missed something, is too noisy, or sits at the wrong severity.
title: "[Rule] "
labels: ["detection"]
assignees: ["Mateodevv"]
body:
  - type: markdown
    attributes:
      value: |
        The most valuable report this project gets. Two things that look like
        bugs and are not:

        - **Attack attempts were not flagged.** SQL injection, traversal and
          PHP-in-uploads become findings only when one was answered **2xx**.
          Repelled attempts stay a counter on the actor.
        - **Nothing at INFO.** INFO is hidden by default; the severity filter
          brings it back.

        **Nothing from a real case.** Describe the shape of the file or log
        line, or invent a minimal one that triggers it — an invented example
        is worth more than a real one anyway, because it can go in a test.

  - type: input
    id: rule
    attributes:
      label: Rule id
      description: Settings → Detection shows it under every rule, and the rule's own source next to it.
      placeholder: webshell.eval_input
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - It fired on something clean (false positive)
        - It missed something it should catch (false negative)
        - It fires on the right things but far too often
        - It is right but sits at the wrong severity
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: A minimal example
      description: Invented, not from a case. The smallest file or line that shows the behaviour.
      render: text
      placeholder: |
        <?php
        // legitimate template helper — the rule reads this as a dropper
        file_put_contents($cacheFile, $renderedHtml);
    validations:
      required: true

  - type: textarea
    id: verdict
    attributes:
      label: What it concluded, and what it should have
      placeholder: Flagged HIGH as a file dropper. Nothing from the request reaches the write — the second argument is rendered output.
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: Before you submit
      options:
        - label: The example above is invented or public, not taken from a real case.
          required: true
