# CI — runs on every push so that "it builds" is a fact, not a claim.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: web
      - name: oxlint
        run: npx oxlint src --deny-warnings
        working-directory: web
      # Thirteen of the fifty-five bugs the hunt confirmed were in web/src,
      # which had no test runner at all. A suite that does not run here is a
      # suite that rots, and these guard state machines -- a note filled from
      # the wrong object, a verdict left over from the previous artifact --
      # which no amount of type checking can see.
      - name: Tests
        run: npm test -- --run
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows: path handling is exactly the class of bug that
        # only the other operating system reveals.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Imports
        run: python -c "import server.app, server.main, server.geoip; print('import ok')"
      # The end-to-end test: real files go in, the normal engines run over
      # them, and every assertion is about what came out. A detection rule
      # that stops firing turns this red.
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  package:
    name: Package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build
      # The PEP 517 backend runs npm and stages web/dist under server/static.
      # Building successfully is not enough: the old pipeline also succeeded
      # while producing a wheel whose entire interface was missing.
      - name: Build sdist and wheel
        run: python -m build
      - name: Install and smoke-test the wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.package-smoke/bin/python" \
            "$GITHUB_WORKSPACE/tools/package_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
