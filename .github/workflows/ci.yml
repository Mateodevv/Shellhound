# CI — runs on every push so that "it builds" is a fact, not a claim.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: oxlint
        run: npx oxlint src --deny-warnings
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows: path handling is exactly the class of bug that
        # only the other operating system reveals.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Imports
        run: python -c "import server.app, server.main, server.geoip; print('import ok')"
      # The end-to-end test: real files go in, the normal engines run over
      # them, and every assertion is about what came out. A detection rule
      # that stops firing turns this red.
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  package:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
