# CI — runs on every push so that "it builds" is a fact, not a claim.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Source and history privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Structural privacy checks
        run: python -m tools.check_release_privacy source --history
      - name: Privacy guard regressions
        run: python -m unittest tests.test_release_privacy -v
      - uses: ./.github/actions/setup-gitleaks
      - name: Redacted history secret scan
        shell: bash
        run: |
          if ! gitleaks git . --log-opts=--all --redact=100 --ignore-gitleaks-allow \
            --no-banner --log-level=error > "$RUNNER_TEMP/gitleaks-history.log" 2>&1; then
            echo "::error::History secret scan failed. Reproduce locally with redacted output."
            exit 1
          fi

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: web
      - name: oxlint
        run: npx oxlint src --deny-warnings
        working-directory: web
      # Thirteen of the fifty-five bugs the hunt confirmed were in web/src,
      # which had no test runner at all. A suite that does not run here is a
      # suite that rots, and these guard state machines -- a note filled from
      # the wrong object, a verdict left over from the previous artifact --
      # which no amount of type checking can see.
      - name: Tests
        run: npm test -- --run
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Bundle budget
        run: npm run check:bundle
        working-directory: web

  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows: path handling is exactly the class of bug that
        # only the other operating system reveals.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Imports
        run: python -c "import server.app, server.main, server.integrations.geoip; print('import ok')"
      # The end-to-end test: real files go in, the normal engines run over
      # them, and every assertion is about what came out. A detection rule
      # that stops firing turns this red.
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  startup:
    name: Startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Startup and safe-update contracts
        run: python -m unittest tests.test_startup -v
      - name: File discovery, warnings and targeted retries
        run: python -m unittest tests.test_file_scan_retries tests.test_scan_retry_api tests.test_size_skip_review -v
      - name: Fresh setup and updated interface over HTTP
        run: python -m tools.startup_smoke

  package:
    name: Package builds and installs
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build
      # The PEP 517 backend runs npm and stages web/dist under server/static.
      # Building successfully is not enough: the old pipeline also succeeded
      # while producing a wheel whose entire interface was missing.
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect built archive contents
        run: python -m tools.check_release_privacy archives dist/*.whl dist/*.tar.gz
      - uses: ./.github/actions/setup-gitleaks
      - name: Redacted package secret scan
        shell: bash
        run: |
          if ! gitleaks dir dist --max-archive-depth=4 --redact=100 --ignore-gitleaks-allow \
            --no-banner --log-level=error > "$RUNNER_TEMP/gitleaks-packages.log" 2>&1; then
            echo "::error::Package secret scan failed. Reproduce locally with redacted output."
            exit 1
          fi
      - name: Install and smoke-test the wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.package-smoke/bin/python" \
            "$GITHUB_WORKSPACE/tools/package_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
