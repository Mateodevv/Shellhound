name: Set up pinned Gitleaks
description: Install the reviewed Linux x64 Gitleaks release after checksum verification.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
        archive="$tool_dir/gitleaks.tar.gz"
        curl --fail --silent --show-error --location \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$archive"
        printf '%s  %s\n' \
          '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
          "$archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$tool_dir" gitleaks
        chmod +x "$tool_dir/gitleaks"
        echo "$tool_dir" >> "$GITHUB_PATH"
